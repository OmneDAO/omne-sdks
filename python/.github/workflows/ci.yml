name: CI

on:
  push:
    branches:
      - main
      - develop
      - "release/**"
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

concurrency:
  group: python-sdk-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  tests:
    name: Python SDK Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Checkout omne-blockchain repository
        uses: actions/checkout@v4
        with:
          repository: OmneDAO/omne-blockchain
          path: omne-blockchain

      - name: Build validator docker image
        run: |
          docker build \
            --file omne-blockchain/Dockerfile \
            --tag omne-validator-ci:${{ github.sha }} \
            omne-blockchain

      - name: Run pytest suite
        env:
          OMNE_SDK_NODE_IMAGE: omne-validator-ci:${{ github.sha }}
          OMNE_SDK_SKIP_BUILD: "1"
          OMNE_DOCKER_COMPOSE_CMD: docker compose
        run: python -m pytest

      - name: Build distribution artifacts
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          python -m pip install build
          python -m build

      - name: Publish package to GitHub Packages
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          repository-url: https://pypi.pkg.github.com/${{ github.repository_owner }}

      - name: Prune docker images
        if: always()
        run: docker image prune --force
