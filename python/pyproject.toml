[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omne-sdk"
version = "0.1.0"
description = "Official Python SDK for Omne Blockchain - Commerce-First Blockchain with Dual-Layer Consensus"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "OmneDAO", email = "dev@omne.org"}
]
keywords = ["blockchain", "web3", "cryptocurrency", "omne", "commerce", "ai", "ml"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "requests>=2.31.0",
    "websockets>=12.0.0",
    "cryptography>=41.0.7",
    "mnemonic>=0.21",
    "eth-keys>=0.5.0",
    "pydantic>=2.5.0",
    "asyncio-mqtt>=0.16.0",
    "typing-extensions>=4.8.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "mypy>=1.0.0",
    "flake8>=5.0.0",
]
ai = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "torch>=1.12.0",
    "transformers>=4.20.0",
]
scientific = [
    "numpy>=1.21.0",
    "scipy>=1.8.0",
    "matplotlib>=3.5.0",
]

[project.urls]
Homepage = "https://omne.org"
Documentation = "https://docs.omne.org"
Repository = "https://github.com/OmneDAO/omne-blockchain"
"Bug Tracker" = "https://github.com/OmneDAO/omne-blockchain/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["omne_sdk*"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "strict"
markers = [
    "integration: integration scenarios that exercise external services",
    "performance: performance-focused checks that may run longer than unit tests",
]
