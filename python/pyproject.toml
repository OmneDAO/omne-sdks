[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omne-sdk"
version = "0.1.0"
description = "Omne Python SDK — post-quantum (ML-DSA-44) wallet, ABI, and JSON-RPC client"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "OmneDAO" }]
keywords = ["omne", "blockchain", "post-quantum", "ml-dsa", "fips-204"]
dependencies = [
    # FIPS 204 ML-DSA-44. _keygen_internal(xi) is byte-identical to the TS
    # SDK's @noble/post-quantum ml_dsa44.keygen(seed) (parity-verified).
    "dilithium-py>=1.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/omne_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
